<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Dashboard V2</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00adb5;
            --pedali-color: #ff4d4d;
            --voce-color: #00bcd4;
            --occhi-color: #ff9800;
            --clima-color: #4caf50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h2 {
            text-align: center;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 6px;
            display: block;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .section-title {
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 2px solid #333;
            padding-bottom: 6px;
            margin-bottom: 12px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Layout Blocchi Pulsanti Separati */
        .block-tag {
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background-color: #181818;
        }
        
        .tag-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn-tag {
            flex: 1;
            min-width: 120px;
            padding: 12px 8px;
            font-size: 0.85rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
            text-align: center;
            transition: transform 0.1s;
        }
        .btn-tag:active { transform: scale(0.95); }

        .p-bg { background-color: var(--pedali-color); }
        .v-bg { background-color: var(--voce-color); color: #121212; }
        .o-bg { background-color: var(--occhi-color); }
        .c-bg { background-color: var(--clima-color); }

        /* Diario di Bordo */
        textarea#liveLog {
            font-family: monospace;
            font-size: 0.95rem;
            height: 160px;
            line-height: 1.4;
        }

        /* Valutazioni finali */
        .eval-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            background: #252525;
            padding: 10px;
            border-radius: 6px;
        }
        .eval-row select {
            width: 75px;
            text-align: center;
            font-weight: bold;
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* Bottoni Azione Principali */
        .action-btn {
            background-color: #10ac84;
            color: #fff;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .clear-btn {
            background-color: #444;
            font-size: 0.9rem;
            padding: 10px;
        }

        /* Titolo nascosto a schermo, visibile solo in stampa */
        .print-header { display: none; }

        /* =======================================================
           STILE TIPOGRAFICO PER IL DOWNLOAD IN PDF (STAMPA)
           ======================================================= */
        @media print {
            body { background: #fff !important; color: #000 !important; padding: 0; }
            .container { max-width: 100%; }
            .card { background: #fff !important; box-shadow: none !important; border: 1px solid #ddd !important; margin-bottom: 15px !important; padding: 15px !important; }
            .block-tag, .action-btn, .clear-btn, h2 { display: none !important; }
            .print-header { display: block !important; text-align: center; border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
            .print-header h1 { margin: 0; font-size: 1.6rem; color: #000; }
            .section-title { color: #000 !important; border-bottom: 2px solid #000 !important; font-size: 1.1rem !important; }
            input, textarea { background: #fff !important; color: #000 !important; border: 1px solid #999 !important; padding: 8px !important; }
            textarea#liveLog { height: auto !important; min-height: 120px; }
            .eval-row { background: #f5f5f5 !important; border: 1px solid #ccc !important; color: #000 !important; }
            .eval-row select { background: #f5f5f5 !important; color: #000 !important; border: none !important; -webkit-appearance: none; appearance: none; font-size: 1.1rem !important; }
            label { color: #333 !important; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="print-header">
        <h1>RELAZIONE VALUTAZIONE TIROCINANTE</h1>
        <p>Autoscuola Fortunato - Programma Mentor di Affiancamento</p>
    </div>

    <h2>Mentor Dashboard V2 🚗</h2>
    
    <div class="card">
        <div class="grid-inputs">
            <div>
                <label>Allievo / Allieva Guida</label>
                <input type="text" id="allievo" placeholder="Es. Mastrantonio Adriano">
            </div>
            <div>
                <label>Dettaglio Patente & Sede</label>
                <input type="text" id="patente" placeholder="Es. Pat. B • Genazzano">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Pulsantiera Segnalazioni Rapide (Auto-Calcolo Voti)</div>
        
        <div class="block-tag" style="border-left: 4px solid var(--pedali-color);">
            <label style="color: var(--pedali-color);">⏱️ GESTIONE PEDALI & RIFLESSI</label>
            <div class="tag-row">
                <button class="btn-tag p-bg" onclick="addTag('PA', '⏱️ P.A. [Pedale Anticipato]')">P.A. (Anticipato)</button>
                <button class="btn-tag p-bg" onclick="addTag('PT', '⏱️ P.T. [Pedale Tardivo]')">P.T. (Tardivo)</button>
                <button class="btn-tag p-bg" onclick="addTag('PP', '⏱️ P.P. [Piede Pesante]')">P.P. (Piede Friz.)</button>
            </div>
        </div>

        <div class="block-tag" style="border-left: 4px solid var(--voce-color);">
            <label style="color: var(--voce-color);">🗣️ COMANDI VOCALI & ANTICIPO</label>
            <div class="tag-row">
                <button class="btn-tag v-bg" onclick="addTag('CA', '🗣️ C.A. [Comando Anticipato]')">C.A. (Ottimo)</button>
                <button class="btn-tag v-bg" onclick="addTag('CT', '🗣️ C.T. [Comando Tardivo]')">C.T. (In Ritardo)</button>
                <button class="btn-tag v-bg" onclick="addTag('SP', '🗣️ S.P. [Sovraccarico Parola]')">S.P. (Parla Troppo)</button>
            </div>
        </div>

        <div class="block-tag" style="border-left: 4px solid var(--occhi-color);">
            <label style="color: var(--occhi-color);">👀 SGUARDO & CONTROLLO STRADA</label>
            <div class="tag-row">
                <button class="btn-tag o-bg" onclick="addTag('OB', '👀 O.B. [Occhi Bassi su Cambio/Cruscotto]')">O.B. (Occhi Bassi)</button>
                <button class="btn-tag o-bg" onclick="addTag('MC', '👀 M.C. [Mancato Controllo Specchi/Cieco]')">M.C. (No Specchi)</button>
            </div>
        </div>

        <div class="block-tag" style="border-left: 4px solid var(--clima-color);">
            <label style="color: var(--clima-color);">🧠 EMOTIVITÀ & GESTIONE STRESS</label>
            <div class="tag-row">
                <button class="btn-tag c-bg" onclick="addTag('GE', '🧠 G.E. [Gestione Eccellente del Panico]')">G.E. (Calma Top)</button>
                <button class="btn-tag c-bg" onclick="addTag('TA', '🧠 T.A. [Tono Ansioso / Irritato]')">T.A. (Tono Teso)</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Elenco Segnalazioni Accumulate</div>
        <textarea id="liveLog" placeholder="I tag cliccati appariranno qui automaticamente come elenco..."></textarea>
    </div>

    <div class="card">
        <div class="section-title">Valutazione Livello Intervento Mentor (Scala 0-10)</div>
        
        <div class="eval-row">
            <label>1. Tempismo Pedali / Riflessi</label>
            <select id="votoPedali"></select>
        </div>
        <div class="eval-row">
            <label>2. Chiarezza & Anticipo Comandi</label>
            <select id="votoVoce"></select>
        </div>
        <div class="eval-row">
            <label>3. Sguardo e Lettura Strada (Sedile DX)</label>
            <select id="votoOcchi"></select>
        </div>
        <div class="eval-row">
            <label>4. Leadership & Gestione Stress (Clima)</label>
            <select id="votoClima"></select>
        </div>
        <div class="eval-row">
            <label>5. Qualità Diagnosi & Note Finali (DA FARE)</label>
            <select id="votoNote"></select>
        </div>
        
        <label style="margin-top: 15px;">Note Finali del Mentor (Punti chiave debriefing):</label>
        <textarea id="noteMentor" rows="3" placeholder="Note da riferire a motore spento per farla crescere..."></textarea>
    </div>

    <button class="action-btn" onclick="window.print()">📥 SCARICA PDF REPORT</button>
    <button class="action-btn clear-btn" onclick="clearAll()">🔄 Ripristina Schermata Vuota</button>

</div>

<script>
    // Registro dei conteggi dei tag inseriti per l'algoritmo
    let contatori = { PA: 0, PT: 0, PP: 0, CA: 0, CT: 0, SP: 0, OB: 0, MC: 0, GE: 0, TA: 0 };

    // Funzione per popolare i menu a tendina 0-10 all'avvio
    window.onload = function() {
        const dropIds = ['votoPedali', 'votoVoce', 'votoOcchi', 'votoClima', 'votoNote'];
        dropIds.forEach(id => {
            const select = document.getElementById(id);
            for(let i = 10; i >= 0; i--) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerHTML = i;
                select.appendChild(opt);
            }
        });
        resetVotiIniziali();
    };

    function resetVotiIniziali() {
        // Valori di partenza ideali
        document.getElementById('votoPedali').value = 10;
        document.getElementById('votoVoce').value = 8; // parte da 8, i CA aumentano, i CT diminuiscono
        document.getElementById('votoOcchi').value = 10;
        document.getElementById('votoClima').value = 8;
        document.getElementById('votoNote').value = 8;
    }

    // Inserimento Tag nel diario e calcolo automatico dei punteggi
    function addTag(codice, testoCompleto) {
        const logArea = document.getElementById('liveLog');
        logArea.value += `• ${testoCompleto}\n`;
        logArea.scrollTop = logArea.scrollHeight; // Auto-scroll

        // Incrementa il contatore specifico del tag cliccato
        contatori[codice]++;

        // Esegui il calcolo matematico dei voti in base ai pesi assegnati
        calcolaPunteggiDinamici();
    }

    function calcolaPunteggiDinamici() {
        // 1. PEDALI (Base 10)
        let pedali = 10 - (contatori.PA * 1.5) - (contatori.PT * 2.5) - (contatori.PP * 0.5);
        
        // 2. VOCE (Base 7, i comportamenti positivi aggiungono punti)
        let voce = 7 + (contatori.CA * 1.0) - (contatori.CT * 2.0) - (contatori.SP * 1.0);
        
        // 3. OCCHI (Base 10)
        let occhi = 10 - (contatori.OB * 1.5) - (contatori.MC * 3.0);
        
        // 4. CLIMA (Base 7)
        let clima = 7 + (contatori.GE * 1.5) - (contatori.TA * 2.0);
        
        // 5. NOTE/DIAGNOSI (Risente indirettamente della lucidità generale)
        let note = 8 + (contatori.GE * 0.5) - (contatori.SP * 0.5) - (contatori.CT * 0.5);

        // Funzione di contenimento (Clamping) per non scendere sotto 0 e non superare 10
        const sistemaVoto = (valore) => Math.min(10, Math.max(0, Math.round(valore)));

        // Aggiorna l'interfaccia visiva all'istante
        document.getElementById('votoPedali').value = sistemaVoto(pedali);
        document.getElementById('votoVoce').value = sistemaVoto(voce);
        document.getElementById('votoOcchi').value = sistemaVoto(occhi);
        document.getElementById('votoClima').value = sistemaVoto(clima);
        document.getElementById('votoNote').value = sistemaVoto(note);
    }

    function clearAll() {
        if(confirm("Vuoi azzerare la scheda corrente? Tutti i dati andranno persi.")) {
            document.getElementById('allievo').value = '';
            document.getElementById('patente').value = '';
            document.getElementById('liveLog').value = '';
            document.getElementById('noteMentor').value = '';
            // Azzera i contatori interni dell'algoritmo
            for (let chiave in contatori) { contatori[chiave] = 0; }
            resetVotiIniziali();
        }
    }
</script>

</body>
</html>
